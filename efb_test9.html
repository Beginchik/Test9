<script>
"use strict";
/* =========================================================

const LISTENING_AUDIO_PATHS = {
  listening1: "audio/efb_test9_listening1.mp3",

};
const LS_KEY = "efb_ft9a_state_v2";
const MAX_LISTENS = 2;

/* =========================================================
   TEST DATA – section order matches the original PDF:
   Grammar, Vocabulary, Pronunciation, Practical English,
   Reading, Writing, Listening, Speaking
   ========================================================= */
const PE_PHRASES = ["How about a coffee","Yes, I'd love to","No, thanks","See you there","Sorry, I can't","Would you like"];

const DATA = [
{id:"grammar", name:"Grammar", teacher:false, exercises:[
  {title:"Exercise 1", instr:"Complete the sentences. Use the present continuous form of the verb in brackets.",
   example:"Example: I can't talk right now. I <b>am driving</b> (drive) to the office.",
   questions:[
    {qid:"g1q1",num:1,type:"text",prompt:"Sam ___ (cook) a meal for his friends.",ansList:["is cooking","s cooking"],exp:"Present continuous with \u201cSam\u201d (he): is + cooking."},
    {qid:"g1q2",num:2,type:"text",prompt:"Megan ___ (shop). She wants to buy some books.",ansList:["is shopping","s shopping"],exp:"Present continuous with \u201cMegan\u201d (she): is + shopping (double p)."},
    {qid:"g1q3",num:3,type:"text",prompt:"We ___ (stay) in a hotel in the city centre.",ansList:["are staying","re staying"],exp:"Present continuous with \u201cwe\u201d: are + staying."},
    {qid:"g1q4",num:4,type:"text",prompt:"The children ___ (do) their homework in their bedrooms.",ansList:["are doing","re doing"],exp:"Present continuous with \u201cthe children\u201d (they): are + doing."},
    {qid:"g1q5",num:5,type:"text",prompt:"I ___ (have) a great time in London.",ansList:["am having","m having"],exp:"Present continuous with \u201cI\u201d: am + having."}
   ]},
  {title:"Exercise 2", instr:"Tick (✓) the correct verb form.",
   example:"Example: We always <b>eat</b> / are eating lunch at home on Sundays.",
   questions:[
    {qid:"g2q1",num:1,type:"mc",prompt:"Max sometimes ___ in a coffee shop at the weekend.",options:["works","is working"],ans:0,exp:"\u201cSometimes\u201d = a routine/habit → present simple: works."},
    {qid:"g2q2",num:2,type:"mc",prompt:"Julio ___ an email to his mother at the moment.",options:["writes","is writing"],ans:1,exp:"\u201cAt the moment\u201d = happening now → present continuous: is writing."},
    {qid:"g2q3",num:3,type:"mc",prompt:"That's my girlfriend over there. She ___ a red dress.",options:["wears","is wearing"],ans:1,exp:"She is wearing it now (over there) → present continuous: is wearing."},
    {qid:"g2q4",num:4,type:"mc",prompt:"We usually ___ the TV after work.",options:["watch","are watching"],ans:0,exp:"\u201cUsually\u201d = a routine → present simple: watch."},
    {qid:"g2q5",num:5,type:"mc",prompt:"Tina ___ for her train right now.",options:["waits","is waiting"],ans:1,exp:"\u201cRight now\u201d = happening now → present continuous: is waiting."}
   ]}

{id:"vocabulary", name:"Vocabulary", teacher:false, exercises:[
  {title:"Exercise 3", instr:"Complete the email with a verb from the box. Use the correct verb form.",

   context:"Hi Penny, We're on holiday now in Venice and we're having a great time! Here are some photos of everything so far… See you on Monday! Carla",
   questions:[
    {qid:"v3q1",num:1,type:"text",prompt:"The first photo is me. I'm at home and I'm ___ my suitcase.",ansList:["packing"],exp:"You put clothes in a suitcase → pack. After \u201cI'm\u201d use -ing: packing."},
    {qid:"v3q2",num:2,type:"text",prompt:"In the third photo, we're ___ in Venice.",ansList:["arriving"],exp:"You get to a place → arrive. After \u201cwe're\u201d use -ing: arriving."},

    {qid:"v3q4",num:4,type:"text",prompt:"In the next photo, we're ___ presents for our friends.",ansList:["buying"],exp:"You get presents in shops → buy. After \u201cwe're\u201d: buying."},
    {qid:"v3q5",num:5,type:"text",prompt:"And in the last photo, it's me in our little car – we're ___ a car here for a week!",ansList:["renting"],exp:"You pay to use a car → rent. After \u201cwe're\u201d: renting."}
   ]},
  {title:"Exercise 4", instr:"Complete the sentences. Write one word in each gap. The words are all related to clothes.",
   example:"Example: I like wearing <b>jeans</b> and a T-shirt at the weekends.",

    {qid:"v4q3",num:3,type:"text",prompt:"I work in a bank. I wear a s___, a shirt, and tie every day.",ansList:["suit"],exp:"Formal clothes for work: jacket and trousers together → suit."},

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const saved = JSON.parse(raw); state = Object.assign(state, saved); }
  }catch(e){ storageOK=false; }
  if(!storageOK) document.getElementById("storageWarn").style.display="block";
}
let saveTimerFlag=null;
function saveState(){
  state.lastSaved = Date.now();
  lastSaveAt = state.lastSaved;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ storageOK=false; document.getElementById("storageWarn").style.display="block"; return; }
  const flag=document.getElementById("savedFlag");
  flag.classList.add("show");
  clearTimeout(saveTimerFlag);
  saveTimerFlag=setTimeout(()=>flag.classList.remove("show"),1600);
}

/* ---------- IndexedDB for recordings ---------- */
let idbFailed=false;
function openIDB(){
  return new Promise((resolve,reject)=>{
    if(idbFailed){reject(new Error("idb unavailable"));return;}
    try{
      const req = indexedDB.open("efb_ft9a_db",1);
      req.onupgradeneeded = ()=>{ const db=req.result; if(!db.objectStoreNames.contains("recordings")) db.createObjectStore("recordings"); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>{idbFailed=true;reject(req.error);};
    }catch(e){idbFailed=true;reject(e);}
  });
}
async function idbPut(key,blob){ const db=await openIDB(); return new Promise((res,rej)=>{ const tx=db.transaction("recordings","readwrite"); tx.objectStore("recordings").put(blob,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(key){ const db=await openIDB(); return new Promise((res,rej)=>{ const tx=db.transaction("recordings","readonly"); const r=tx.objectStore("recordings").get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function idbDel(key){ try{ const db=await openIDB(); return new Promise((res)=>{ const tx=db.transaction("recordings","readwrite"); tx.objectStore("recordings").delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }catch(e){} }

/* =========================================================
   HELPERS
   ========================================================= */
function norm(s){ return String(s).toLowerCase().replace(/['\u2019]/g,"").replace(/\s+/g," ").trim(); }
function isTextCorrect(q,val){ if(val==null||val==="")return null; const n=norm(val); return q.ansList.some(a=>norm(a)===n); }
function getAnswered(q){
  if(teacherSecIds.indexOf(q.secId)>-1){
    const hasText = String(state.teacher[q.qid]||"").trim().length>0;
    const hasRec = !!state.recMeta[q.qid];
    if(q.type==="essay") return hasText;
    return hasText || hasRec;
  }
  const v = state.answers[q.qid];
  return !(v===undefined || v===null || v==="");
}
function getCorrect(q){
  const v = state.answers[q.qid];
  if(v===undefined||v===null||v==="")return null;
  if(q.type==="tf") return (v==="true")===q.ans;
  if(q.type==="mc"||q.type==="stress") return Number(v)===q.ans;
  if(q.type==="text") return isTextCorrect(q,v);
  return null;
}
function fmtTime(sec){
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return m+":"+String(s).padStart(2,"0");
}
function fmtTimeLong(sec){
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  if(m===0) return s+" seconds";
  return m+(m===1?" minute":" minutes")+" "+s+(s===1?" second":" seconds");
}
function fmtDate(ts){
  const d=new Date(ts);
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+", "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* =========================================================
   MODAL
   ========================================================= */
const overlay=document.getElementById("overlay");
const modalTitle=document.getElementById("modalTitle");
const modalBody=document.getElementById("modalBody");
const modalActions=document.getElementById("modalActions");
let lastFocus=null;
function openModal(title,bodyHTML,actions){
  lastFocus=document.activeElement;
  modalTitle.textContent=title;
  modalBody.innerHTML=bodyHTML;
  modalActions.innerHTML="";
  actions.forEach(a=>{
    const b=document.createElement("button");
    b.className="btn "+(a.cls||"btn-ghost");
    b.textContent=a.label;
    b.onclick=()=>{ if(a.onClick) a.onClick(); if(a.keepOpen!==true) closeModal(); };
    modalActions.appendChild(b);
  });
  overlay.classList.add("show");
  const first=modalActions.querySelector("button"); if(first) first.focus();
}
function closeModal(){ overlay.classList.remove("show"); if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&overlay.classList.contains("show")) closeModal(); });

function inputFor(q){
  const inp=document.createElement("input");
  inp.type="text"; inp.id="in-"+q.qid;
  inp.setAttribute("aria-label","Answer for question "+q.num);
  inp.autocomplete="off"; inp.spellcheck=false;
  inp.value = state.answers[q.qid]||"";
  inp.addEventListener("input",()=>{ state.answers[q.qid]=inp.value; refreshQuestion(q.qid); saveState(); });
  inp.addEventListener("blur",()=>{ state.answers[q.qid]=inp.value; refreshQuestion(q.qid); saveState(); });
  return inp;
}

/* Builds a prompt paragraph; every run of underscores (_) becomes one text input. */
function buildPromptWithInput(q){
  const p=document.createElement("p"); p.className="q-prompt";
  const label=document.createElement("span"); label.className="q-label"; label.textContent=q.num+".";
  p.appendChild(label);
  const parts=String(q.prompt).split(/_+/);
  parts.forEach((part,i)=>{
    const span=document.createElement("span"); span.innerHTML=part;
    p.appendChild(span);
    if(i<parts.length-1) p.appendChild(inputFor(q));
  });
  return p;
}

function buildQuestion(q,sec){
  const wrap=document.createElement("div");
  wrap.className="question"; wrap.id="q-"+q.qid; wrap.dataset.qid=q.qid;

  if(q.type==="essay"||q.type==="speak"){
    const pr=document.createElement("div"); pr.className="q-prompt";
    pr.innerHTML='<span class="q-label">'+q.num+'.</span> '+q.prompt;
    wrap.appendChild(pr);
    const ta=document.createElement("textarea");
    ta.id="ta-"+q.qid; ta.placeholder="Write your answer here…";
    ta.value=state.teacher[q.qid]||"";
    ta.setAttribute("aria-label","Written answer for question "+q.num);
    let taT=null;
    ta.addEventListener("input",()=>{ state.teacher[q.qid]=ta.value; clearTimeout(taT); taT=setTimeout(()=>{refreshQuestion(q.qid);saveState();},400); updateCharCount(); });
    wrap.appendChild(ta);
    const cc=document.createElement("div"); cc.className="charcount"; cc.id="cc-"+q.qid;
    wrap.appendChild(cc);
    function updateCharCount(){ const w=ta.value.trim()?ta.value.trim().split(/\s+/).length:0; cc.textContent=w+" words"; }
    updateCharCount();

    if(q.type==="speak") wrap.appendChild(buildRecorder(q));

    const st=document.createElement("div"); st.className="feedback pending"; st.id="st-"+q.qid;
    wrap.appendChild(st);
    return wrap;
  }

  if(q.type==="text"){
    wrap.appendChild(buildPromptWithInput(q));
  } else {
    const pLine=document.createElement("p"); pLine.className="q-prompt";
    pLine.innerHTML='<span class="q-label">'+q.num+'.</span> <span>'+q.prompt+'</span>';
    wrap.appendChild(pLine);
    const opts=document.createElement("div");
    if(q.type==="tf"){
      opts.className="opts row"; opts.setAttribute("role","radiogroup");
      ["true","false"].forEach((v,i)=>{
        const lab=document.createElement("label"); lab.className="opt";
        lab.innerHTML='<input type="radio" name="opt-'+q.qid+'" value="'+v+'"><span>'+(i===0?"True ✓":"False ✗")+'</span>';
        const r=lab.querySelector("input");
        if(String(state.answers[q.qid])===v) r.checked=true;
        r.addEventListener("change",()=>{ state.answers[q.qid]=v; refreshQuestion(q.qid); saveState(); });
        opts.appendChild(lab);
      });
    } else {
      opts.className="opts"+(q.type==="stress"?" row":"");
      opts.setAttribute("role","radiogroup");
      const list = q.type==="stress" ? ["1","2","3"] : q.options;
      list.forEach((optTxt,idx)=>{
        const lab=document.createElement("label"); lab.className="opt";
        lab.innerHTML='<input type="radio" name="opt-'+q.qid+'" value="'+idx+'"><span>'+(q.type==="stress"?("Syllable "+optTxt):esc(optTxt))+'</span>';
        const r=lab.querySelector("input");
        if(state.answers[q.qid]!==undefined && Number(state.answers[q.qid])===idx) r.checked=true;
        r.addEventListener("change",()=>{ state.answers[q.qid]=idx; refreshQuestion(q.qid); saveState(); });
        opts.appendChild(lab);
      });
    }
    wrap.appendChild(opts);
  }
  const fb=document.createElement("div"); fb.className="feedback"; fb.id="fb-"+q.qid;
  wrap.appendChild(fb);
  return wrap;
}

function buildRecorder(q){

/* ---------- Listening player (max 2 complete listens) ---------- */
const players={};
function setupPlayer(taskId){
  const audio=new Audio(LISTENING_AUDIO_PATHS[taskId]);
  audio.preload="metadata";
  const btn=document.getElementById("playbtn-"+taskId);
  const ll=document.getElementById("ll-"+taskId);
  const err=document.getElementById("aerr-"+taskId);
  if(!btn) return;
  players[taskId]={audio,btn,ll,err};
  audio.addEventListener("error",()=>{ err.style.display="inline"; });
  audio.addEventListener("ended",()=>{
    if((state.listens[taskId]||0)<MAX_LISTENS){ state.listens[taskId]=(state.listens[taskId]||0)+1; saveState(); }
    updatePlayerUI(taskId);
  });
  audio.addEventListener("play",()=>updatePlayerUI(taskId));
  audio.addEventListener("pause",()=>updatePlayerUI(taskId));
  btn.addEventListener("click",()=>{
    if(audio.paused){
      const used=state.listens[taskId]||0;
      if(used>=MAX_LISTENS && audio.currentTime===0) return; // no listens left and nothing to resume
      audio.play().catch(()=>{ err.style.display="inline"; });
    } else {
      audio.pause();
    }
  });
  updatePlayerUI(taskId);
}
function updatePlayerUI(taskId){
  const p=players[taskId]; if(!p)return;
  const used=state.listens[taskId]||0;
  const left=Math.max(0,MAX_LISTENS-used);
  const a=p.audio;
  if(!a.paused){ p.btn.innerHTML="⏸ Pause"; }
  else if(a.currentTime>0 && !a.ended){ p.btn.innerHTML="▶ Resume"; }
  else { p.btn.innerHTML="▶ Listen"; }
  // disabled only when both listens are used AND there is nothing paused mid-way to resume
  p.btn.disabled = (left===0 && a.paused && (a.ended || a.currentTime===0));
  if(left===0){ p.ll.textContent="No listens left"; p.ll.classList.add("none"); }
  else { p.ll.textContent="Listens left: "+left; p.ll.classList.remove("none"); }
}

/* ---------- Speaking recorder ---------- */
const recStates={};
function setupRecorder(q){
  const qid=q.qid;
  recStates[qid]={recorder:null,stream:null,chunks:[],startTs:0,interval:null};
  const btn=document.getElementById("recbtn-"+qid);
  const fileIn=document.getElementById("recfile-"+qid);
  const delBtn=document.getElementById("recdel-"+qid);
  if(!btn) return;
  btn.addEventListener("click",()=>toggleRecording(q));
  fileIn.addEventListener("change",async ()=>{
    const f=fileIn.files&&fileIn.files[0];
    if(!f)return;
    await saveRecordingBlob(q,f,"speaking_"+qid+"_"+f.name);
    fileIn.value="";
  });
  delBtn.addEventListener("click",()=>{
    openModal("Delete recording?","This will permanently delete your recording for Speaking question "+q.num+". This cannot be undone.",[
      {label:"Cancel",cls:"btn-ghost"},
      {label:"Delete",cls:"btn-danger",onClick:async()=>{
        await idbDel("rec_"+qid);
        delete state.recMeta[qid];
        saveState(); renderRecPlayer(q); refreshQuestion(qid);
      }}
    ]);
  });
  // restore recording after reload
  (async()=>{
    try{
      const blob=await idbGet("rec_"+qid);
      if(blob){
        if(!state.recMeta[qid]) state.recMeta[qid]={type:blob.type,size:blob.size,ts:Date.now()};
        renderRecPlayer(q); refreshQuestion(qid);
      }
    }catch(e){}
  })();
}
function showRecMsg(qid,text,type){
  const m=document.getElementById("recmsg-"+qid);
  if(!m)return;
  m.textContent=text; m.className="rec-msg show "+type;
}
function toggleRecording(q){
  const qid=q.qid, rs=recStates[qid];
  if(rs.recorder && rs.recorder.state==="recording"){ stopRecording(q); return; }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    showRecMsg(qid,"Recording is not supported in this browser. Please use the 📁 upload button to attach an audio file instead.","err");
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true})
  .then(stream=>{
    rs.stream=stream; rs.chunks=[];
    let rec;
    try{ rec=new MediaRecorder(stream); }catch(e){
      showRecMsg(qid,"Recording is not supported in this browser. Please use the 📁 upload button instead.","err");
      stream.getTracks().forEach(t=>t.stop());
      return;
    }
    rs.recorder=rec;
    rec.ondataavailable=e=>{ if(e.data && e.data.size) rs.chunks.push(e.data); };
    rec.onstop=async()=>{
      const blob=new Blob(rs.chunks,{type:rec.mimeType||"audio/webm"});
      stream.getTracks().forEach(t=>t.stop());
      rs.recorder=null; rs.stream=null;
      clearInterval(rs.interval);
      const btn=document.getElementById("recbtn-"+qid);
      btn.classList.remove("recording");
      btn.innerHTML="🎙";
      document.getElementById("rectimer-"+qid).textContent="0:00";
      if(blob.size>0) await saveRecordingBlob(q,blob);
    };
    rec.start();
    rs.startTs=Date.now();
    const btn=document.getElementById("recbtn-"+qid);
    btn.classList.add("recording"); btn.innerHTML="⏹";
    btn.setAttribute("aria-label","Stop recording");
    showRecMsg(qid,"🔴 Recording… Click ⏹ to stop (max 2 minutes).","info");
    rs.interval=setInterval(()=>{
      const el=(Date.now()-rs.startTs)/1000;
      document.getElementById("rectimer-"+qid).textContent=fmtTime(el);
      if(el*1000>=MAX_RECORD_MS){ stopRecording(q); }
    },250);
  })
  .catch(errr=>{
    let msg="Microphone access was denied. Your speaking answer is important for your teacher to grade — please allow microphone access and try again, or use the 📁 upload button to attach an audio file.";
    if(errr && errr.name==="NotFoundError") msg="No microphone was found. Please connect a microphone, or use the 📁 upload button to attach an audio file.";
    showRecMsg(qid,msg,"err");
  });
}
function stopRecording(q){
  const rs=recStates[q.qid];
  if(rs && rs.recorder && rs.recorder.state==="recording") rs.recorder.stop();
}
async function saveRecordingBlob(q,blob,name){
  const qid=q.qid;
  try{ await idbPut("rec_"+qid,blob); }
  catch(e){ showRecMsg(qid,"⚠ Your recording could not be saved to browser storage. It will be available for this session only.","err"); }
  state.recMeta[qid]={type:blob.type||"audio/webm",size:blob.size,ts:Date.now(),url:URL.createObjectURL(blob),name:name||("speaking_"+qid+".webm")};
  saveState();
  const m=document.getElementById("recmsg-"+qid); if(m) m.classList.remove("show");
  renderRecPlayer(q); refreshQuestion(qid);
}
function renderRecPlayer(q){
  const qid=q.qid;
  const meta=state.recMeta[qid];
  const playerHost=document.getElementById("recplayer-"+qid);
  const statusEl=document.getElementById("recstatus-"+qid);
  const delBtn=document.getElementById("recdel-"+qid);
  if(!playerHost||!statusEl||!delBtn) return;
  if(!meta){
    playerHost.classList.remove("show"); playerHost.innerHTML="";
    statusEl.textContent="Not recorded"; statusEl.classList.remove("saved");
    delBtn.classList.add("hidden");
    return;
  }
  if(!meta.url){
    statusEl.textContent="Recording saved ✓"; statusEl.classList.add("saved");
    delBtn.classList.remove("hidden");
    idbGet("rec_"+qid).then(blob=>{ if(blob){ meta.url=URL.createObjectURL(blob); renderRecPlayer(q);} }).catch(()=>{});
    return;
  }
  playerHost.innerHTML='<audio controls src="'+meta.url+'" aria-label="Playback of your recording for question '+q.num+'"></audio>';
  playerHost.classList.add("show");
  statusEl.textContent="Recording saved ✓"; statusEl.classList.add("saved");
  delBtn.classList.remove("hidden");
}

/* ---------- Refresh question visuals ---------- */
function refreshQuestion(qid){
  const q=qIndex[qid]; if(!q)return;
  const wrap=document.getElementById("q-"+qid);
  if(!wrap)return;
  const isTeacher = teacherSecIds.indexOf(q.secId)>-1;
  wrap.classList.remove("state-correct","state-incorrect","state-teacher");
  if(isTeacher){
    const st=document.getElementById("st-"+qid);
    const hasText=String(state.teacher[qid]||"").trim().length>0;
    const hasRec=!!state.recMeta[qid];
    let txt="";
    if(hasText&&hasRec) txt="🧑‍🏫 Recording and text saved — awaiting teacher grading";
    else if(hasRec) txt="🧑‍🏫 Recording saved — awaiting teacher grading";
    else if(hasText) txt="🧑‍🏫 Written text saved — awaiting teacher grading";
    if(st){ st.textContent=txt; st.className="feedback pending"+(txt?" show":""); }
    if(hasText||hasRec) wrap.classList.add("state-teacher");
  } else {
    const res=getCorrect(q);
    const inp = q.type==="text" ? document.getElementById("in-"+qid) : null;
    const fb=document.getElementById("fb-"+qid);
    wrap.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel-ok","sel-bad"));
    if(inp){ inp.classList.remove("ok","bad"); }
    if(res===null){ if(fb){fb.className="feedback";fb.textContent="";} }
    else if(res){
      wrap.classList.add("state-correct");
      if(inp) inp.classList.add("ok");
      markSelectedOpt(wrap,true);
      if(fb){ fb.className="feedback ok show"; fb.textContent="✓ Correct"; }
    } else {
      wrap.classList.add("state-incorrect");
      if(inp) inp.classList.add("bad");
      markSelectedOpt(wrap,false);
      if(fb){ fb.className="feedback bad show"; fb.textContent="✗ Incorrect — try again or keep your answer"; }
    }
  }
  refreshDots(); refreshChips(); updateScriptBtn();
}
function markSelectedOpt(wrap,ok){
  const sel=wrap.querySelector(".opt input:checked");
  if(sel){ sel.closest(".opt").classList.add(ok?"sel-ok":"sel-bad"); }
}
function refreshDots(){
  allQuestions.forEach(q=>{
    const d=dotMap[q.qid]; if(!d)return;
    const isTeacher=teacherSecIds.indexOf(q.secId)>-1;
    let cls="pdot ";
    if(isTeacher){ cls += getAnswered(q)?"teacher ":"unanswered "; }
    else{
      const res=getCorrect(q);
      if(res===null) cls+="unanswered ";
      else cls+=(res?"correct ":"incorrect ");
    }
    if(currentQid===q.qid) cls+="current";
    d.className=cls.trim();
  });
}
function refreshChips(){
  DATA.forEach(sec=>{
    const qs=[]; sec.exercises.forEach(ex=>ex.questions.forEach(q=>qs.push(q)));
    const done=qs.filter(q=>getAnswered(q)).length;
    const el=document.getElementById("chipcnt-"+sec.id);
    if(el) el.textContent="("+done+"/"+qs.length+")";
  });
}
function setCurrentQ(qid){ if(currentQid===qid)return; currentQid=qid; refreshDots(); }

/* ---------- Navigation ---------- */
function goToSection(i){
  curSection=Math.max(0,Math.min(DATA.length-1,i));
  state.sectionIdx=curSection; saveState();

/* ---------- Reset ---------- */
function openResetModal(sec){
  openModal("Reset options","What would you like to reset?",[
    {label:"Reset "+sec.name,cls:"btn-danger",onClick:()=>confirmReset("section",sec)},
    {label:"Reset the whole test",cls:"btn-danger",onClick:()=>confirmReset("all",sec)},
    {label:"Cancel",cls:"btn-ghost"}
  ]);
}
function confirmReset(scope,sec){
  const msg = scope==="all"
    ? "Reset the whole test?<br><br>This will delete all answers and recordings in all sections. This cannot be undone.<br><br><i>Note: listening audio play counts are kept.</i>"
    : "Reset all answers in "+sec.name+"?<br><br>This will also delete any recordings in this section. This cannot be undone."+((sec.id==="listening")?"<br><br><i>Note: your listening play count will not be reset.</i>":"");
  openModal(scope==="all"?"Reset the whole test?":"Reset "+sec.name+"?",msg,[
    {label:"Cancel",cls:"btn-ghost"},
    {label:scope==="all"?"Reset everything":"Reset "+sec.name,cls:"btn-danger",onClick:()=>doReset(scope,sec)}
  ]);
}
async function doReset(scope,sec){
  const secs = scope==="all"? DATA : [sec];
  for(const s of secs){
    for(const ex of s.exercises){
      for(const q of ex.questions){
        delete state.answers[q.qid];
        delete state.teacher[q.qid];
        if(state.recMeta[q.qid]){ delete state.recMeta[q.qid]; await idbDel("rec_"+q.qid); renderRecPlayer(q); }
        const inp=document.getElementById("in-"+q.qid); if(inp){ inp.value=""; inp.classList.remove("ok","bad"); }
        const ta=document.getElementById("ta-"+q.qid); if(ta) ta.value="";
        const cc=document.getElementById("cc-"+q.qid); if(cc) cc.textContent="0 words";
        document.querySelectorAll('#q-'+q.qid+' input[type=radio]').forEach(r=>{r.checked=false;});
        refreshQuestion(q.qid);
      }
    }
  }
  if(scope==="all"){
    state.elapsed=0; state.submitted=false; state.submittedAt=null;
    stopTimer(); startTimer();
    document.getElementById("resultsHost").classList.add("hidden");
    document.getElementById("resultsHost").innerHTML="";
    document.getElementById("sectionsHost").classList.remove("hidden");
    document.getElementById("secNav").classList.remove("hidden");
    document.getElementById("navRow").classList.remove("hidden");
    document.getElementById("submitRow").classList.remove("hidden");
    goToSection(0);
  }
  saveState(); refreshDots(); refreshChips(); updateScriptBtn();
}

/* ---------- Submit ---------- */
function collectUnanswered(){
  const out=[];
  DATA.forEach(sec=>{
    const missing=[];
    sec.exercises.forEach(ex=>ex.questions.forEach(q=>{ if(!getAnswered(q)) missing.push(ex.title+" Q"+q.num); }));
    if(missing.length) out.push({name:sec.name, missing});
  });
  return out;
}
document.getElementById("submitBtn").addEventListener("click",()=>{

  if(un.length){

    un.forEach(u=>{ html+='<div class="warn-item"><b>'+u.name+':</b> '+u.missing.join(", ")+'</div>'; });
    html+='<p style="margin-top:10px">You can go back and answer them, or submit the test anyway.</p>';
    openModal("Some questions are unanswered",html,[
      {label:"Go back",cls:"btn-primary"},
      {label:"Submit anyway",cls:"btn-green",onClick:doSubmit}
    ]);
  } else {
    openModal("Submit test?","Are you sure you want to submit your test? After submitting you will see your automatic results. Speaking and Writing will be graded by your teacher.",[
      {label:"Cancel",cls:"btn-ghost"},
      {label:"Submit Test ✓",cls:"btn-green",onClick:doSubmit}
    ]);

});
function doSubmit(){
  state.submitted=true;

}

/* ---------- Timer ---------- */
function startTimer(){
  document.getElementById("timerTxt").textContent=fmtTime(state.elapsed);
  if(state.submitted) return;
  lastTick=Date.now();
  timerHandle=setInterval(()=>{
    const now=Date.now();
    if(document.hidden){ lastTick=now; return; } // pause when tab is hidden
    state.elapsed += (now-lastTick)/1000;
    lastTick=now;
    document.getElementById("timerTxt").textContent=fmtTime(state.elapsed);
    if(now-lastSaveAt>5000) saveState();
  },1000);
}
function stopTimer(){ if(timerHandle){clearInterval(timerHandle);timerHandle=null;} }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveState(); else lastTick=Date.now(); });
window.addEventListener("beforeunload",()=>saveState());

/* =========================================================
   RESULTS / REVIEW / SHARE
   ========================================================= */
function computeResults(){
  let correct=0, incorrect=0, unanswered=0;
  const perSec={};
  DATA.forEach(sec=>{
    if(sec.teacher){ perSec[sec.id]={teacher:true,total:0,saved:0}; }
    else perSec[sec.id]={teacher:false,total:0,correct:0,incorrect:0,unanswered:0};
  });
  autoQuestions.forEach(q=>{
    const st=perSec[q.secId]; st.total++;
    const res=getCorrect(q);
    if(res===null){unanswered++;st.unanswered++;}
    else if(res){correct++;st.correct++;}
    else {incorrect++;st.incorrect++;}
  });
  DATA.forEach(sec=>{
    if(sec.teacher){
      sec.exercises.forEach(ex=>ex.questions.forEach(q=>{
        perSec[sec.id].total++;
        if(getAnswered(q)) perSec[sec.id].saved++;
      }));
    }
  });
  const pct = autoQuestions.length? Math.round(correct/autoQuestions.length*100):0;
  let grade;
  if(pct>=90)grade="Excellent"; else if(pct>=75)grade="Good"; else if(pct>=60)grade="Satisfactory"; else grade="Needs improvement";
  const recCount=Object.keys(state.recMeta).length;
  return {correct,incorrect,unanswered,total:autoQuestions.length,pct,grade,perSec,recCount};
}
function studentAnswerText(q){
  const v=state.answers[q.qid];
  if(v===undefined||v===null||v==="")return "(no answer)";
  if(q.type==="tf") return v==="true"?"True":"False";
  if(q.type==="stress") return "Syllable "+(Number(v)+1);
  if(q.type==="mc") return q.options[Number(v)];
  return String(v);
}
function correctAnswerText(q){
  if(q.type==="tf") return q.ans?"True":"False";
  if(q.type==="stress") return "Syllable "+(q.ans+1);
  if(q.type==="mc") return q.options[q.ans];
  return q.ansList[0];
}
function buildSummaryText(){
  const r=computeResults();
  const wrong=autoQuestions.filter(q=>getCorrect(q)===false)
    .map(q=>"• "+q.secName+" "+q.exTitle+" Q"+q.num+" – your answer: "+studentAnswerText(q)).join("\n");
  let t="EFB File Test 9A Result\n";
  t+="Date: "+fmtDate(state.submittedAt||Date.now())+"\n";
  t+="Automatic score: "+r.correct+"/"+r.total+"\n";
  t+="Percentage: "+r.pct+"%\n";
  t+="Provisional grade: "+r.grade+"\n";
  t+="Speaking: "+(r.recCount?r.recCount+" recording(s) saved, ":"")+"awaiting teacher grading\n";
  t+="Writing: "+(String(state.teacher["w1"]||"").trim()?"text saved, ":"not answered, ")+"awaiting teacher grading\n";
  t+="Correct: "+r.correct+" · Incorrect: "+r.incorrect+" · Unanswered: "+r.unanswered+"\n";
  if(wrong) t+="\nMistakes:\n"+wrong+"\n";
  t+="\nTime taken: "+fmtTimeLong(state.elapsed)+"\n";
  t+="Completed: "+fmtDate(state.submittedAt||Date.now())+"\n";
  return t;
}
function showResults(){
  const r=computeResults();
  document.getElementById("sectionsHost").classList.add("hidden");
  document.getElementById("secNav").classList.add("hidden");
  document.getElementById("navRow").classList.add("hidden");
  document.getElementById("submitRow").classList.add("hidden");
  document.getElementById("timerTxt").textContent=fmtTime(state.elapsed);
  const host=document.getElementById("resultsHost");
  host.classList.remove("hidden");

  let secRows="";
  DATA.forEach(sec=>{
    const st=r.perSec[sec.id];
    if(st.teacher){
      secRows+='<div class="sec-status"><span><b>'+sec.name+'</b></span><span class="pill p">🧑‍🏫 Awaiting teacher grading'+(st.saved?" · "+st.saved+"/"+st.total+" saved":" · not answered")+'</span></div>';
    } else {
      secRows+='<div class="sec-status"><span><b>'+sec.name+'</b></span><span><span class="pill g">✓ '+st.correct+'</span> <span class="pill r">✗ '+st.incorrect+'</span>'+(st.unanswered?' <span class="pill a">– '+st.unanswered+' blank</span>':'')+'</span></div>';
    }
  });

  host.innerHTML=
  '<div class="card res-hero">'+
    '<div style="font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Test submitted 🎉</div>'+
    '<div class="res-score">'+r.correct+' / '+r.total+'</div>'+
    '<div style="color:var(--muted);font-weight:600">Automatic score · '+r.pct+'%</div>'+
    '<div class="res-grade">Provisional grade: '+r.grade+'</div>'+
    '<div style="font-size:.8rem;color:var(--muted);max-width:460px;margin:6px auto 0">This grade is <b>provisional</b> — it is based only on automatically graded sections. Speaking and Writing will be graded by your teacher.</div>'+
    '<div class="res-grid">'+
      '<div class="res-cell"><div class="k">✓ Correct</div><div class="v" style="color:var(--green)">'+r.correct+'</div></div>'+
      '<div class="res-cell"><div class="k">✗ Incorrect</div><div class="v" style="color:var(--red)">'+r.incorrect+'</div></div>'+
      '<div class="res-cell"><div class="k">– Unanswered</div><div class="v" style="color:var(--amber)">'+r.unanswered+'</div></div>'+
      '<div class="res-cell"><div class="k">🎙 Recordings saved</div><div class="v" style="color:var(--purple)">'+r.recCount+'</div></div>'+
      '<div class="res-cell"><div class="k">Completed</div><div class="v" style="font-size:.85rem">'+fmtDate(state.submittedAt||Date.now())+'</div></div>'+
      '<div class="res-cell"><div class="k">Time taken</div><div class="v" style="font-size:.85rem">'+fmtTimeLong(state.elapsed)+'</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="card"><h3 style="margin-top:0">Section status</h3>'+secRows+'</div>'+
  '<div class="card" style="text-align:center">'+
    '<button class="btn btn-primary" id="reviewBtn">🔍 Review Results</button> '+
    '<button class="btn btn-purple" id="shareBtn">📤 Share Results</button> '+
    '<button class="btn btn-ghost" id="copyBtn">📋 Copy Results</button> '+
    '<button class="btn btn-ghost" id="exportBtn">⬇ Download Results Package</button>'+
    '<div class="share-row">'+
      '<button class="btn btn-ghost btn-sm" id="waBtn">WhatsApp</button>'+
      '<button class="btn btn-ghost btn-sm" id="tgBtn">Telegram</button>'+
      '<button class="btn btn-ghost btn-sm" id="mailBtn">Email</button>'+
    '</div>'+
  '</div>'+
  '<div id="reviewHost"></div>';

  document.getElementById("reviewBtn").onclick=renderReview;
  document.getElementById("copyBtn").onclick=copyResults;
  document.getElementById("shareBtn").onclick=shareResults;
  document.getElementById("exportBtn").onclick=exportPackage;
  document.getElementById("waBtn").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(buildSummaryText()),"_blank");
  document.getElementById("tgBtn").onclick=()=>window.open("https://t.me/share/url?url="+encodeURIComponent(location.href)+"&text="+encodeURIComponent(buildSummaryText()),"_blank");
  document.getElementById("mailBtn").onclick=()=>{window.location.href="mailto:?subject="+encodeURIComponent("EFB File Test 9A Result")+"&body="+encodeURIComponent(buildSummaryText());};
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderReview(){
  const host=document.getElementById("reviewHost");
  host.innerHTML="";
  const card=document.createElement("div"); card.className="card";
  card.innerHTML="<h3 style='margin-top:0'>🔍 Review Results</h3><p style='color:var(--muted);font-size:.88rem'>Your mistakes are shown with the correct answers and short explanations. Teacher-graded answers are shown as saved.</p>";

  const wrongList=autoQuestions.filter(q=>getCorrect(q)===false);
  const h=document.createElement("div");
  if(wrongList.length){
    h.innerHTML='<div class="rv-sec-title">✗ Incorrect answers ('+wrongList.length+')</div>';
    wrongList.forEach(q=>{
      const d=document.createElement("div"); d.className="review-item wrong";
      d.innerHTML='<div style="font-size:.78rem;font-weight:700;color:var(--muted)">'+q.secName+" · "+q.exTitle+" · Q"+q.num+'</div>'+
        '<div style="margin:6px 0">'+q.prompt+'</div>'+
        '<div class="ans-line"><span class="ans-wrong">Your answer: '+esc(studentAnswerText(q))+' ✗</span></div>'+
        '<div class="ans-line"><span class="ans-correct">Correct answer: '+esc(correctAnswerText(q))+' ✓</span></div>'+
        '<div class="expl">💡 '+q.exp+'</div>';
      h.appendChild(d);
    });
  } else {
    h.innerHTML='<div class="rv-sec-title">✗ Incorrect answers</div><div class="review-item" style="border-color:#86efac;background:#f6fef9">🎉 No mistakes in the automatically graded sections!</div>';
  }
  const unans=autoQuestions.filter(q=>getCorrect(q)===null);
  if(unans.length){
    h.innerHTML+='<div class="rv-sec-title">– Unanswered questions ('+unans.length+')</div>';
    unans.forEach(q=>{
      const d=document.createElement("div"); d.className="review-item wrong";
      d.innerHTML='<div style="font-size:.78rem;font-weight:700;color:var(--muted)">'+q.secName+" · "+q.exTitle+" · Q"+q.num+'</div>'+
        '<div style="margin:6px 0">'+q.prompt+'</div>'+
        '<div class="ans-line"><span class="ans-wrong">Your answer: (no answer) ✗</span></div>'+
        '<div class="ans-line"><span class="ans-correct">Correct answer: '+esc(correctAnswerText(q))+' ✓</span></div>'+
        '<div class="expl">💡 '+q.exp+'</div>';
      h.appendChild(d);
    });
  }
  h.innerHTML+='<div class="rv-sec-title">🎧 Listening</div><div class="review-item"><button class="btn btn-purple btn-sm" id="rvScriptBtn">📜 View listening scripts</button></div>';

  h.innerHTML+='<div class="rv-sec-title">🧑‍🏫 Teacher-graded sections</div>';
  DATA.filter(s=>s.teacher).forEach(sec=>{
    sec.exercises.forEach(ex=>ex.questions.forEach(q=>{
      const d=document.createElement("div"); d.className="review-item teacher";
      let inner='<div style="font-size:.78rem;font-weight:700;color:var(--muted)">'+sec.name+" · "+ex.title+(ex.questions.length>1?" · Q"+q.num:"")+'</div><div style="margin:6px 0">'+q.prompt+'</div>';
      const txt=String(state.teacher[q.qid]||"").trim();
      inner+= txt? '<div class="ans-line"><b>Your written answer:</b><div style="background:#f8fafc;border-radius:8px;padding:8px 10px;margin-top:4px;white-space:pre-wrap">'+esc(txt)+'</div></div>' : '<div class="ans-line" style="color:var(--muted)">No written answer.</div>';
      if(q.type==="speak"){
        if(state.recMeta[q.qid]) inner+='<div class="ans-line"><b>Your recording:</b><div id="rv-rec-'+q.qid+'" style="margin-top:4px"></div></div>';
        else inner+='<div class="ans-line" style="color:var(--muted)">No recording saved.</div>';
      }
      inner+='<div class="expl" style="background:var(--purple-bg);border-color:var(--purple);color:#4c1d95">🧑‍🏫 This section will be graded by a teacher.</div>';
      d.innerHTML=inner;
      h.appendChild(d);
      if(q.type==="speak" && state.recMeta[q.qid]){
        (async()=>{
          const mount=document.getElementById("rv-rec-"+q.qid);
          if(!mount)return;
          let url=state.recMeta[q.qid].url;
          if(!url){ const blob=await idbGet("rec_"+q.qid).catch(()=>null); if(blob) url=URL.createObjectURL(blob); }
          mount.innerHTML=url?'<audio controls src="'+url+'"></audio>':'<span style="color:var(--muted)">Recording unavailable.</span>';
        })();
      }
    }));
  });
  card.appendChild(h);
  host.appendChild(card);
  const rs=document.getElementById("rvScriptBtn"); if(rs) rs.onclick=openScriptModal;
  host.scrollIntoView({behavior:"smooth"});
}

async function copyResults(){
  const txt=buildSummaryText()+"\n(Full written answers and speaking recordings are included in the downloaded results package.)";
  try{ await navigator.clipboard.writeText(txt); toast("📋 Results copied to clipboard!"); }
  catch(e){
    openModal("Copy results",'<textarea readonly style="min-height:220px">'+esc(txt)+'</textarea>',[{label:"Close",cls:"btn-primary"}]);
  }
}
function toast(msg){
  openModal("Done",'<p style="margin:0">'+msg+'</p>',[{label:"OK",cls:"btn-primary"}]);
}
async function shareResults(){
  const files=[];
  const txt=buildSummaryText();
  files.push(new File([txt],"efb_test9a_results.txt",{type:"text/plain"}));
  for(const qid in state.recMeta){
    try{
      let blob=await idbGet("rec_"+qid);
      if(!blob && state.recMeta[qid].url){
        blob=await fetch(state.recMeta[qid].url).then(r=>r.blob()).catch(()=>null);
      }
      if(blob){
        const ext=(blob.type&&blob.type.indexOf("mp4")>-1)?".m4a":((blob.type&&blob.type.indexOf("ogg")>-1)?".ogg":".webm");
        files.push(new File([blob],"speaking_"+qid+ext,{type:blob.type||"audio/webm"}));
      }
    }catch(e){}
  }
  if(navigator.share){
    try{
      if(navigator.canShare && navigator.canShare({files})){
        await navigator.share({title:"EFB File Test 9A Result",text:txt,files});
        return;
      }
      await navigator.share({title:"EFB File Test 9A Result",text:txt});
      return;
    }catch(e){ if(e && e.name==="AbortError") return; }
  }
  exportPackage();
}
async function exportPackage(){
  let full=buildSummaryText()+"\n\n===== WRITTEN ANSWERS (teacher-graded) =====\n";
  DATA.filter(s=>s.teacher).forEach(sec=>sec.exercises.forEach(ex=>ex.questions.forEach(q=>{
    full+="\n["+sec.name+" "+ex.title+" Q"+q.num+"]\n"+(String(state.teacher[q.qid]||"").trim()||"(no written answer)")+"\n";
  })));
  full+="\n\nNote: your speaking recordings are downloaded as separate audio files. Please attach them when sending your results to your teacher.\n";
  downloadBlob(new Blob([full],{type:"text/plain"}),"efb_test9a_results.txt");
  for(const qid in state.recMeta){
    try{
      let blob=await idbGet("rec_"+qid);
      if(!blob && state.recMeta[qid].url){
        blob=await fetch(state.recMeta[qid].url).then(r=>r.blob()).catch(()=>null);
      }
      if(blob){
        const ext=(blob.type&&blob.type.indexOf("mp4")>-1)?".m4a":((blob.type&&blob.type.indexOf("ogg")>-1)?".ogg":".webm");
        downloadBlob(blob,"speaking_"+qid+ext);
      }
    }catch(e){}
  }
  toast("⬇ Results package downloaded. You may need to attach the files manually when sending them to your teacher.");
}
function downloadBlob(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  loadState();
  buildProgress();
  buildNav();
  buildSections();
  allQuestions.forEach(q=>refreshQuestion(q.qid));
  refreshDots(); refreshChips(); updateScriptBtn();
  document.getElementById("prevBtn").addEventListener("click",()=>goToSection(curSection-1));
  document.getElementById("nextBtn").addEventListener("click",()=>{
    if(curSection===DATA.length-1) document.getElementById("submitBtn").click();
    else goToSection(curSection+1);
  });
  if("IntersectionObserver" in window){
    const io=new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting && e.target.dataset.qid) setCurrentQ(e.target.dataset.qid); });
    },{rootMargin:"-15% 0px -70% 0px"});
    document.querySelectorAll(".question").forEach(el=>io.observe(el));
  }
  if(state.submitted){ showResults(); }
  else{ goToSection(state.sectionIdx||0); startTimer(); }
}
init();
</script>
